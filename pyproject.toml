[project]
name = "turnstile"
version = "0.0.0"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]
exclude = ["packages/agent"]   # spike-only until Wave 1 builds it into a real package

[dependency-groups]
dev = ["pytest>=8.0", "turnstile-schema"]

[tool.uv.sources]
turnstile-schema = { workspace = true }

[tool.pytest.ini_options]
pythonpath = []
addopts = "-q"
