[project]
name = "turnstile"
version = "0.0.0"
description = "Voice-AI margin profiler: price every turn, adjudicate resolution, detect waste, prove savings by replay."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Pranav Koduru", email = "pranavkoduruc@gmail.com" }]
urls = { Repository = "https://github.com/Pranavk098/turnstile", Demo = "https://turnstile-demo.onrender.com" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
# Depend on every workspace member so `uv sync` installs them all (and their
# deps, e.g. agent's opentelemetry, replay's numpy). Without this, a plain
# `uv sync` drops non-root-reachable member deps and agent/replay fail to import.
dev = [
    "pytest>=9.1.1",
    "turnstile-schema",
    "turnstile-pricing",
    "turnstile-verdict",
    "turnstile-detectors",
    "turnstile-replay",
    "turnstile-corpus",
    "turnstile-experiments",
    "turnstile-agent",
    "turnstile-ingest",
    "turnstile-live",
    "turnstile-service",
    "turnstile-quality",
]
# Real synthesis engine for the barge-in harness (packages/agent) -- OPTIONAL:
# plain `uv sync` does not install it; `uv sync --group piper` does. Every
# test runs on the fake engine without it; the real-Piper integration test
# skips cleanly when absent.
piper = ["piper-tts>=1.8.0"]
# Local, offline sentence embeddings for D3's cosine half (GAP-10,
# packages/detectors) -- OPTIONAL: plain `uv sync` does not install it;
# `uv sync --group embed` does. The model (all-MiniLM-L6-v2) must already be
# in the local HuggingFace cache; tests skip cleanly without the extra and
# never touch the network at test time.
embed = ["sentence-transformers>=6.0.1"]

[tool.uv.sources]
turnstile-schema = { workspace = true }
turnstile-pricing = { workspace = true }
turnstile-verdict = { workspace = true }
turnstile-detectors = { workspace = true }
turnstile-replay = { workspace = true }
turnstile-corpus = { workspace = true }
turnstile-experiments = { workspace = true }
turnstile-agent = { workspace = true }
turnstile-ingest = { workspace = true }
turnstile-live = { workspace = true }
turnstile-service = { workspace = true }
turnstile-quality = { workspace = true }

[tool.pytest.ini_options]
pythonpath = []
addopts = "-q"
