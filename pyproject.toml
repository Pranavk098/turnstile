[project]
name = "turnstile"
version = "0.0.0"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
# Depend on every workspace member so `uv sync` installs them all (and their
# deps, e.g. otel's opentelemetry, stats' numpy). Without this, a plain
# `uv sync` drops non-root-reachable member deps and otel/stats fail to import.
dev = [
    "pytest>=8.0",
    "turnstile-schema",
    "turnstile-pricing",
    "turnstile-verdict",
    "turnstile-otel",
    "turnstile-detectors",
    "turnstile-stats",
    "turnstile-replay",
    "turnstile-corpus",
    "turnstile-experiments",
    "turnstile-agent",
]
# Real synthesis engine for the barge-in harness (packages/agent) -- OPTIONAL:
# plain `uv sync` does not install it; `uv sync --group piper` does. Every
# test runs on the fake engine without it; the real-Piper integration test
# skips cleanly when absent.
piper = ["piper-tts>=1.2"]
# Local, offline sentence embeddings for D3's cosine half (GAP-10,
# packages/detectors) -- OPTIONAL: plain `uv sync` does not install it;
# `uv sync --group embed` does. The model (all-MiniLM-L6-v2) must already be
# in the local HuggingFace cache; tests skip cleanly without the extra and
# never touch the network at test time.
embed = ["sentence-transformers>=2.2"]

[tool.uv.sources]
turnstile-schema = { workspace = true }
turnstile-pricing = { workspace = true }
turnstile-verdict = { workspace = true }
turnstile-otel = { workspace = true }
turnstile-detectors = { workspace = true }
turnstile-stats = { workspace = true }
turnstile-replay = { workspace = true }
turnstile-corpus = { workspace = true }
turnstile-experiments = { workspace = true }
turnstile-agent = { workspace = true }

[tool.pytest.ini_options]
pythonpath = []
addopts = "-q"
