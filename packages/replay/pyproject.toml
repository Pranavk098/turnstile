[project]
name = "turnstile-replay"
dynamic = ["version"]
description = "Counterfactual replay engine proving savings with outcome-preservation gating."
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Pranav Koduru", email = "pranavkoduruc@gmail.com" }]
urls = { Repository = "https://github.com/Pranavk098/turnstile", Demo = "https://turnstile-demo.onrender.com" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
dependencies = ["turnstile-schema>=0.0.0", "turnstile-pricing>=0.0.0", "turnstile-verdict>=0.0.0", "numpy"]

[project.scripts]
turnstile-replay-smoke = "turnstile_replay._smoke:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { root = "../.." }

[tool.hatch.build.targets.wheel]
packages = ["src/turnstile_replay"]

[tool.uv.sources]
turnstile-schema = { workspace = true }
turnstile-pricing = { workspace = true }
turnstile-verdict = { workspace = true }
