[project]
name = "turnstile-experiments"
version = "0.0.0"
description = "Experiment runners and paid-measurement harness (hard-gated; spends nothing by default)."
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Pranav Koduru", email = "pranavkoduruc@gmail.com" }]
urls = { Repository = "https://github.com/Pranavk098/turnstile", Demo = "https://turnstile-demo.onrender.com" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "turnstile-schema",
    "turnstile-corpus",
    "turnstile-pricing",
    "turnstile-verdict",
    "turnstile-detectors",
    "turnstile-replay",
    "openai",
    "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/turnstile_experiments"]

[tool.uv.sources]
turnstile-schema = { workspace = true }
turnstile-corpus = { workspace = true }
turnstile-pricing = { workspace = true }
turnstile-verdict = { workspace = true }
turnstile-detectors = { workspace = true }
turnstile-replay = { workspace = true }
