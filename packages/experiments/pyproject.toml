[project]
name = "turnstile-experiments"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "turnstile-schema",
    "turnstile-corpus",
    "turnstile-pricing",
    "turnstile-verdict",
    "turnstile-detectors",
    "turnstile-replay",
    "openai",
    "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/turnstile_experiments"]

[tool.uv.sources]
turnstile-schema = { workspace = true }
turnstile-corpus = { workspace = true }
turnstile-pricing = { workspace = true }
turnstile-verdict = { workspace = true }
turnstile-detectors = { workspace = true }
turnstile-replay = { workspace = true }
