[project]
name = "turnstile-quality"
version = "0.0.0"
description = "Deterministic, voice-aware quality rubric reported beside cost; model judges ship calibration-pending."
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Pranav Koduru", email = "pranavkoduruc@gmail.com" }]
urls = { Repository = "https://github.com/Pranavk098/turnstile", Demo = "https://turnstile-demo.onrender.com" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
dependencies = ["turnstile-schema", "turnstile-verdict"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/turnstile_quality"]

[tool.uv.sources]
turnstile-schema = { workspace = true }
turnstile-verdict = { workspace = true }
