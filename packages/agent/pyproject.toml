[project]
name = "turnstile-agent"
version = "0.1.0"
description = "Native barge-in harness: real Piper TTS through the G1 TraceRecorder, producing schema-v1.1 traces the built instrument can price and detect on."
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Pranav Koduru", email = "pranavkoduruc@gmail.com" }]
urls = { Repository = "https://github.com/Pranavk098/turnstile", Demo = "https://turnstile-demo.onrender.com" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "turnstile-schema",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
]

[project.optional-dependencies]
# Real synthesis is an OPTIONAL runtime capability: every unit test runs on the
# injectable fake engine, and the real-Piper integration test skips cleanly
# when this extra (or the voice model) is absent.
piper = ["piper-tts>=1.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/turnstile_agent"]
