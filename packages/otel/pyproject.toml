[project]
name = "turnstile-otel"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "turnstile-schema",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/turnstile_otel"]

[tool.uv.sources]
turnstile-schema = { workspace = true }
