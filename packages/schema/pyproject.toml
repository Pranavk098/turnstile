[project]
name = "turnstile-schema"
dynamic = ["version"]
description = "Frozen v1.1 trace contracts, validators, and rate-table types."
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Pranav Koduru", email = "pranavkoduruc@gmail.com" }]
urls = { Repository = "https://github.com/Pranavk098/turnstile", Demo = "https://turnstile-demo.onrender.com" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
dependencies = ["pydantic>=2.6", "pyyaml>=6.0"]

[project.scripts]
turnstile-schema-smoke = "turnstile_schema._smoke:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Version comes from the git tag (vX.Y.Z), not a hardcoded string, so a release
# ships the version it is tagged as. root = "../.." points hatch-vcs at the repo
# root (the .git and the tag live there, not in this package dir).
[tool.hatch.version]
source = "vcs"
raw-options = { root = "../.." }

[tool.hatch.build.targets.wheel]
packages = ["src/turnstile_schema"]
