[project]
name = "turnstile-schema"
version = "0.0.0"
description = "Frozen v1.1 trace contracts, validators, and rate-table types."
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Pranav Koduru", email = "pranavkoduruc@gmail.com" }]
urls = { Repository = "https://github.com/Pranavk098/turnstile", Demo = "https://turnstile-demo.onrender.com" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
dependencies = ["pydantic>=2.6", "pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/turnstile_schema"]
