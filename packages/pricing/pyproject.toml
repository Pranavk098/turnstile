requires-python = ">=3.12"
dependencies = ["turnstile-schema"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/turnstile_pricing"]

[tool.uv.sources]
turnstile-schema = { workspace = true }