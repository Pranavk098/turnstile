[project]
name = "turnstile-stats"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["turnstile-schema", "numpy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/turnstile_stats"]

[tool.uv.sources]
turnstile-schema = { workspace = true }