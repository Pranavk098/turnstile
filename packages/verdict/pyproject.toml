[project]
name = "turnstile-verdict"
dynamic = ["version"]
description = "Resolution ledger adjudicating whether a call actually resolved."
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Pranav Koduru", email = "pranavkoduruc@gmail.com" }]
urls = { Repository = "https://github.com/Pranavk098/turnstile", Demo = "https://turnstile-demo.onrender.com" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
dependencies = ["turnstile-schema>=0.0.0"]

[project.scripts]
turnstile-verdict-smoke = "turnstile_verdict._smoke:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { root = "../.." }

[tool.hatch.build.targets.wheel]
packages = ["src/turnstile_verdict"]

[tool.uv.sources]
turnstile-schema = { workspace = true }
