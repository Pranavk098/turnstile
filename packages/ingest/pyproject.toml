[project]
name = "turnstile-ingest"
dynamic = ["version"]
description = "Maps real voice-AI platform logs (native format + Vapi adapter) to schema-valid traces; runs the full pipeline."
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Pranav Koduru", email = "pranavkoduruc@gmail.com" }]
urls = { Repository = "https://github.com/Pranavk098/turnstile", Demo = "https://turnstile-demo.onrender.com" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
dependencies = ["turnstile-schema>=0.0.0", "turnstile-pricing>=0.0.0", "turnstile-verdict>=0.0.0", "turnstile-detectors>=0.0.0", "turnstile-replay>=0.0.0", "turnstile-quality>=0.0.0", "pydantic>=2.6", "pyyaml>=6.0"]

[project.scripts]
turnstile-ingest-smoke = "turnstile_ingest._smoke:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { root = "../.." }

[tool.hatch.build.targets.wheel]
packages = ["src/turnstile_ingest"]

[tool.uv.sources]
turnstile-schema = { workspace = true }
turnstile-pricing = { workspace = true }
turnstile-verdict = { workspace = true }
turnstile-detectors = { workspace = true }
turnstile-replay = { workspace = true }
turnstile-quality = { workspace = true }
