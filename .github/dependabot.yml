# Day-5 Part B — keeps Part D's bumped actions (and pip pins) fresh.
# Both ecosystems weekly (Mondays); open-PR limit 5 each so a noisy upstream
# week cannot flood the repo -- a human raises the cap, never the bot.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
