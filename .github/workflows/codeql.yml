name: codeql

# Day-5 Part B — stock CodeQL template for python, supply-chain-pinned.
# Deviations from the stock template (both deliberate, recorded):
# 1. Job is named `codeql` (not stock `analyze`): Part D's release.yml gates
#    on `needs: [audit, bandit, codeql]` -- the agreed job-ID contract.
# 2. `push:` has no branch filter: the repo default branch is mid-migration
#    and the Day-5 threshold-gate proof must run on temp branches. PRs and
#    the weekly schedule cover the default branch regardless.
# $0: no secrets in this file; CodeQL needs only the default GITHUB_TOKEN.

on:
  push:
  pull_request:
  schedule:
    # Weekly: Mondays 06:30 UTC (security.yml runs 06:00 to stagger load).
    - cron: "30 6 * * 1"

jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      # SHAs checked 2026-09-18: checkout@v5, codeql-action@v4.
      - uses: actions/checkout@v7 # fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: github/codeql-action/init@v4 # 1c5b675653bb5c22dbe9b12b556ec555138e09fd
        with:
          languages: python
      - uses: github/codeql-action/autobuild@v4 # 1c5b675653bb5c22dbe9b12b556ec555138e09fd
      - uses: github/codeql-action/analyze@v4 # 1c5b675653bb5c22dbe9b12b556ec555138e09fd
