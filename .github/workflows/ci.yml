name: ci

on:
  push:
  pull_request:

# Least-privilege default token: CI only needs to read the repo. A job that
# needs more must grant it explicitly at the job level.
permissions:
  contents: read

jobs:
  # Ruff is BLOCKING on the real-bug ruleset ([tool.ruff.lint] select=E9,F);
  # mypy is ADVISORY (continue-on-error) until the 34 pre-existing type findings
  # are cleared -- tracked by the "lint + type-check CI gate" issue. Both run via
  # uvx at a pinned version, so no dependency is added to uv.lock.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 (checked 2026-09-18)
      - uses: astral-sh/setup-uv@v7 # bec219d24cd3e171d82865faccec33120bb574f4 (checked 2026-09-18)
      - name: ruff (blocking — pyflakes + syntax)
        run: uvx ruff@0.16.8 check .
      - name: mypy (advisory — non-blocking)
        run: uvx mypy@2.3.1 --ignore-missing-imports --exclude '(^|/)tests/' packages
        continue-on-error: true

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 (checked 2026-09-18)
      - uses: astral-sh/setup-uv@v7 # bec219d24cd3e171d82865faccec33120bb574f4 (checked 2026-09-18)
      - run: uv run --frozen python -m pytest -q

  # Proves `make demo`'s build works from a clean clone with only `uv`:
  # no secrets are granted to this job, and it fails if any paid-path
  # variable is present in the environment.
  keyless-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 (checked 2026-09-18)
      - uses: astral-sh/setup-uv@v7 # bec219d24cd3e171d82865faccec33120bb574f4 (checked 2026-09-18)
      - name: prove no secrets are available
        run: |
          test -z "${OPENAI_API_KEY:-}" || (echo "OPENAI_API_KEY must not be set" && exit 1)
          test -z "${TURNSTILE_ALLOW_PAID:-}" || (echo "TURNSTILE_ALLOW_PAID must not be set" && exit 1)
      - run: make report
      - name: report was produced
        run: |
          test -f packages/dashboard/sample/fleet.json
          test -f packages/dashboard/sample/manifest.json
          test -f packages/ingest/data/data.json

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 (checked 2026-09-18)
      - uses: astral-sh/setup-uv@v7 # bec219d24cd3e171d82865faccec33120bb574f4 (checked 2026-09-18)
      - run: uv run --frozen python scripts/check_links.py

  # Day-6 doc-number guard: key figures (margin, barge-in, PERF) must match
  # their source docs, and README's pytest count must equal a real collection.
  doc-numbers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 (checked 2026-09-18)
      - uses: astral-sh/setup-uv@v7 # bec219d24cd3e171d82865faccec33120bb574f4 (checked 2026-09-18)
      - run: uv run --frozen python scripts/check_doc_numbers.py
