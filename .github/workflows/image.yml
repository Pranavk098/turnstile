name: image

# Day-5 Part E (P1 #7): build the existing Dockerfile, push to GHCR on v* tags,
# attach an SBOM + build provenance. $0: auth is GITHUB_TOKEN only (no PAT --
# GHCR under the repo owner needs nothing else); no secret is ever echoed
# (grep the file: the only secret reference is secrets.GITHUB_TOKEN in `with`).
#
# Action pins (SHAs checked 2026-09-19 via the GitHub tags API):
# - actions/checkout@v5: kept at v5 for consistency with ci.yml / release.yml /
#   link-health.yml (all @v5 # fbc6f39...), even though upstream now has v7 --
#   mixing majors in one repo invites drift; Dependabot (Part B) keeps them fresh.
# - docker/* + anchore/sbom-action + attest-build-provenance: newest patch of the
#   current major at check time (see per-step comments).
# SBOM choice rationale: anchore/sbom-action is the stock GitHub SBOM generator
# (syft backend, SPDX-JSON + automatic workflow-artifact upload, no extra
# secret). The work-split's alternative ("uv's SBOM if available") does not
# exist -- uv exposes lockfiles, not an SBOM-export action -- so anchore is the
# only no-new-dependency choice. Recorded here per §7.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      push:
        description: "Push to GHCR (false = build-only dry run, image loaded locally)"
        type: boolean
        default: false
      tag:
        description: "Tag suffix for dispatch builds"
        default: "dev"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      packages: write # GHCR push (no-op on dry runs)
      id-token: write # attest-build-provenance (push runs only)
      attestations: write # attest-build-provenance (push runs only)
    steps:
      - uses: actions/checkout@v5 # fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 (checked 2026-09-18, re-verified in use 2026-09-19)
      # GHCR image names MUST be lowercase, but one project remote uses a mixed-
      # case owner (Pranavk098/...): lowercase here instead of trusting the context.
      - name: decide push + refs
        id: refs
        run: |
          echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "push=${{ inputs.push }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "version=0.1.0-dev" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v4.4.1 # f87e5991a6d7451dcb8d9637bfbc97413f497069 (checked 2026-09-19)
      - name: log in to GHCR
        if: steps.refs.outputs.push == 'true'
        uses: docker/login-action@v4.6.0 # dbcb813823bdd20940b903addbd779551569679f (checked 2026-09-19)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build (and push on tags)
        id: build
        uses: docker/build-push-action@v7.4.0 # c3c9e263c25d99ce0380d002d59b67737d91b0dc (checked 2026-09-19)
        with:
          context: .
          push: ${{ steps.refs.outputs.push }}
          # Dry runs load the single-arch image into the runner daemon so the
          # SBOM step can scan exactly what was built (load+push are exclusive).
          load: ${{ steps.refs.outputs.push != 'true' }}
          tags: ghcr.io/${{ steps.refs.outputs.owner_lc }}/turnstile-demo:${{ steps.refs.outputs.tag }}
          build-args: |
            VERSION=${{ steps.refs.outputs.version }}
            GITHUB_SHA=${{ github.sha }}
      - name: SBOM (SPDX-JSON)
        uses: anchore/sbom-action@v0.24.2 # 3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 (checked 2026-09-19)
        with:
          image: ghcr.io/${{ steps.refs.outputs.owner_lc }}/turnstile-demo:${{ steps.refs.outputs.tag }}
          format: spdx-json
          output-file: sbom.spdx.json
      # Provenance attestation needs a pushed subject (digest is set only when
      # push=true), so it runs on tag pushes only -- inherent to attestations,
      # not a gap: a dry-run image has no registry subject to attest.
      - name: attest build provenance
        if: steps.refs.outputs.push == 'true'
        uses: actions/attest-build-provenance@v4.2.2 # 4d101475d8b20a2381f78447822ac1eab6504dd8 (checked 2026-09-19)
        with:
          subject-name: ghcr.io/${{ steps.refs.outputs.owner_lc }}/turnstile-demo
          subject-digest: ${{ steps.build.outputs.digest }}
